name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  smoke:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install
    # browsers on. Bump together with @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
